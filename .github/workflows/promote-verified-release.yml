name: Promote verified v2.1.0 build

on:
  push:
    branches: ["arena/d6545b41-noichhar"]
    paths: [".github/workflows/promote-verified-release.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      startsWith(github.event.head_commit.message, 'promote: verified v2.1.0')
    name: Publish the already-verified signed APK
    runs-on: ubuntu-latest
    env:
      VERIFIED_SHA: edc4bcd9f31369a37e1d8af65ba3676bd3c3a037
      CI_RUN: '40528295400'
      SOURCE_RUN: '40528295378'
      VERSION: v2.1.0
      DRAFT_RELEASE_ID: '425633806'
      GH_TOKEN: ${{ github.token }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Confirm the tested source and successful signing checks
        run: |
          set -euo pipefail
          gh run view "$CI_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion \
            | jq -e --arg sha "$VERIFIED_SHA" '.headSha == $sha and .status == "completed" and .conclusion == "success"'
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status \
            | jq -e --arg sha "$VERIFIED_SHA" '.headSha == $sha and .status == "completed"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" \
            | jq -e '[.jobs[].steps[] | select(.name == "Align, sign and verify APK" or .name == "Verify signing-key continuity" or .name == "Upload signed release artifacts") | .conclusion] | sort == ["success", "success", "success"]'

      - name: Check out the verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Download its signed artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: NOichhar-v2.1.0-release
          path: signed-release

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify checksum and signing-certificate continuity again
        run: |
          set -euo pipefail
          (cd signed-release && sha256sum -c "NOichhar-${VERSION}.apk.sha256")
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" > /dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --min-sdk-version 24 "signed-release/NOichhar-${VERSION}.apk"
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'NOichhar-v2.0.0.apk' --dir "$RUNNER_TEMP" --clobber
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/NOichhar-v2.0.0.apk" \
            | grep 'SHA-256 digest' | head -n 1 > "$RUNNER_TEMP/old-cert.txt"
          "$APKSIGNER" verify --print-certs "signed-release/NOichhar-${VERSION}.apk" \
            | grep 'SHA-256 digest' | head -n 1 > "$RUNNER_TEMP/new-cert.txt"
          if ! diff -u "$RUNNER_TEMP/old-cert.txt" "$RUNNER_TEMP/new-cert.txt"; then
            echo "::error::Signing certificate differs from v2.0.0; release not published."
            exit 1
          fi
          cp RELEASE_NOTES.md "$RUNNER_TEMP/RELEASE_NOTES_GENERATED.md"
          printf '\n---\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 < "signed-release/NOichhar-${VERSION}.apk.sha256")" >> "$RUNNER_TEMP/RELEASE_NOTES_GENERATED.md"

      - name: Stage and publish the verified v2.1.0 draft
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error::Publication failed at line $LINENO (exit $code)"; exit "$code"' ERR
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > "$RUNNER_TEMP/draft.json"
          jq -e --arg version "$VERSION" --arg sha "$VERIFIED_SHA" --argjson id "$DRAFT_RELEASE_ID" \
            '.id == $id and .tag_name == $version and .draft == true and .prerelease == false and .target_commitish == $sha' "$RUNNER_TEMP/draft.json"
          tag_sha="$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" |
            awk -v ref="refs/tags/$VERSION" '$2 == ref { direct=$1 } $2 == (ref "^{}") { peeled=$1 } END { if (peeled) print peeled; else if (direct) print direct }')"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$VERIFIED_SHA" ]; then
            echo "::error::Tag $VERSION points to a different object."
            exit 1
          fi
          ensure_asset() {
            local path="$1" name expected assets count
            name="$(basename "$path")"
            expected="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID/assets")"
            count="$(printf '%s' "$assets" | jq --arg name "$name" '[.[] | select(.name == $name)] | length')"
            if [ "$count" = "0" ]; then
              if ! gh release upload "$VERSION" "$path" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/publish.log" 2>&1; then
                cat "$RUNNER_TEMP/publish.log"
                python3 -c 'import os,pathlib; text=pathlib.Path(os.environ["RUNNER_TEMP"], "publish.log").read_text(errors="replace")[-2500:]; print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
                exit 1
              fi
            elif [ "$count" != "1" ] || ! printf '%s' "$assets" | jq -e --arg name "$name" --arg digest "$expected" 'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)' >/dev/null; then
              echo "::error::Existing draft asset $name does not match the verified artifact."
              exit 1
            fi
          }
          ensure_asset "signed-release/NOichhar-${VERSION}.apk"
          ensure_asset "signed-release/NOichhar-${VERSION}.apk.sha256"
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID/assets")"
          apk_digest="sha256:$(sha256sum "signed-release/NOichhar-${VERSION}.apk" | cut -d' ' -f1)"
          sum_digest="sha256:$(sha256sum "signed-release/NOichhar-${VERSION}.apk.sha256" | cut -d' ' -f1)"
          printf '%s' "$assets" | jq -e --arg apk "NOichhar-${VERSION}.apk" --arg sum "NOichhar-${VERSION}.apk.sha256" \
            --arg ad "$apk_digest" --arg sd "$sum_digest" \
            'length == 2 and any(.[]; .name == $apk and .state == "uploaded" and .digest == $ad) and any(.[]; .name == $sum and .state == "uploaded" and .digest == $sd)'
          if ! gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES_GENERATED.md" > "$RUNNER_TEMP/publish.log" 2>&1; then
            cat "$RUNNER_TEMP/publish.log"
            python3 -c 'import os,pathlib; text=pathlib.Path(os.environ["RUNNER_TEMP"], "publish.log").read_text(errors="replace")[-2500:]; print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          cat "$RUNNER_TEMP/publish.log"
