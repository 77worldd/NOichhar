name: Official Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v2.1.0)
        required: true
        default: v2.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, sign and publish
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Restore official signing key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: signing
          key: noichhar-official-release-keystore-${{ runner.os }}-v3

      - name: Require the existing official signing key
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Official signing key cache is unavailable; refusing to create an incompatible key." >&2
          exit 1

      - name: Determine release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version such as v2.1.0" >&2; exit 1
          fi
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ "v$APP_VERSION" != "$VERSION" ]; then
            echo "Release version does not match the application version" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build release APK
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleRelease 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 .github/workflows/report_failures.py release-build.log 'app/build/test-results/**/*.xml'
            exit "$status"
          fi

      - name: Align, sign and verify APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "Unsigned release APK was not produced" >&2
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/noichhar-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.p12 \
            --ks-key-alias noichhar \
            --ks-pass file:signing/password.txt \
            --min-sdk-version 24 \
            --out "NOichhar-${VERSION}.apk" \
            "$RUNNER_TEMP/noichhar-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "NOichhar-${VERSION}.apk"
          sha256sum "NOichhar-${VERSION}.apk" > "NOichhar-${VERSION}.apk.sha256"
          cp RELEASE_NOTES.md RELEASE_NOTES_GENERATED.md
          printf '\n---\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 < "NOichhar-${VERSION}.apk.sha256")" >> RELEASE_NOTES_GENERATED.md

      - name: Verify signing-key continuity
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NOichhar-v2.0.0.apk' --dir "$RUNNER_TEMP" --clobber
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/NOichhar-v2.0.0.apk" \
            | grep 'SHA-256 digest' | head -n 1 > "$RUNNER_TEMP/old-cert.txt"
          "$APKSIGNER" verify --print-certs "NOichhar-${VERSION}.apk" \
            | grep 'SHA-256 digest' | head -n 1 > "$RUNNER_TEMP/new-cert.txt"
          if ! diff -u "$RUNNER_TEMP/old-cert.txt" "$RUNNER_TEMP/new-cert.txt"; then
            echo "::error::Signing certificate does not match v2.0.0; release not published."
            exit 1
          fi
          echo "Release signing certificate matches v2.0.0"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-${{ steps.version.outputs.version }}-release
          path: |
            NOichhar-${{ steps.version.outputs.version }}.apk
            NOichhar-${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite it."
            exit 1
          fi
          tag_sha="$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" |
            awk -v ref="refs/tags/$VERSION" '$2 == ref { direct=$1 } $2 == (ref "^{}") { peeled=$1 } END { if (peeled) print peeled; else if (direct) print direct }')"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $VERSION already points to a different object."
            exit 1
          fi
          gh release create "$VERSION" "NOichhar-${VERSION}.apk" "NOichhar-${VERSION}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NOichhar $VERSION" \
            --notes-file RELEASE_NOTES_GENERATED.md --latest
