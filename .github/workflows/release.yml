name: Official Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, sign and publish
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Restore official signing key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: signing
          key: noichhar-official-release-keystore-${{ runner.os }}-v1

      - name: Create official signing key on first run
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p signing
          PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$PASSWORD" > signing/password.txt
          keytool -genkeypair \
            -alias noichhar \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storetype PKCS12 \
            -keystore signing/release.p12 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=NOichhar Official Release, O=77worldd, C=MA" \
            -noprompt
          chmod 600 signing/release.p12 signing/password.txt

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -z "$VERSION" ]; then
            echo "A release version is required" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build release APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Align, sign and verify APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "Unsigned release APK was not produced" >&2
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/noichhar-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.p12 \
            --ks-key-alias noichhar \
            --ks-pass file:signing/password.txt \
            --key-pass file:signing/password.txt \
            --min-sdk-version 24 \
            --out "NOichhar-${VERSION}.apk" \
            "$RUNNER_TEMP/noichhar-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "NOichhar-${VERSION}.apk"
          sha256sum "NOichhar-${VERSION}.apk" > "NOichhar-${VERSION}.apk.sha256"
          cp RELEASE_NOTES.md RELEASE_NOTES_GENERATED.md
          printf '\n---\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 < "NOichhar-${VERSION}.apk.sha256")" >> RELEASE_NOTES_GENERATED.md

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-${{ steps.version.outputs.version }}-release
          path: |
            NOichhar-${{ steps.version.outputs.version }}.apk
            NOichhar-${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NOichhar ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES_GENERATED.md
          files: |
            NOichhar-${{ steps.version.outputs.version }}.apk
            NOichhar-${{ steps.version.outputs.version }}.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
