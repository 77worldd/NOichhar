name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate XML
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("app/src/main/**/*.xml", recursive=True) + glob.glob(".github/**/*.xml", recursive=True)
          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} XML files")
          PY

      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
