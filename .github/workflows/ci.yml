name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Clean test and build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/src/main/**/*.xml', recursive=True)
          for path in files: ET.parse(path)
          print(f'Validated {len(files)} XML files')
          PY
      - name: Clean, test and build APKs
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 .github/workflows/report_failures.py build-output.log 'app/build/test-results/**/*.xml'
            exit "$status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android API ${{ matrix.api }} smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 29]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            if ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest > /tmp/noichhar-emulator.log 2>&1; then
              status=0
            else
              status=$?
            fi
            cat /tmp/noichhar-emulator.log
            adb logcat -d -s NOICHAR_TEST_FAILURE:E AndroidRuntime:E TestRunner:E > /tmp/noichhar-device-log.txt || true
            exit "$status"
      - name: Annotate instrumentation failures
        if: failure()
        run: python3 .github/workflows/report_failures.py /tmp/noichhar-emulator.log 'app/build/outputs/androidTest-results/**/*.xml'
      - name: Annotate device crash details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/noichhar-device-log.txt')
          if path.exists():
              text = path.read_text(errors='replace')[-12000:]
              for i in range(0, len(text), 3500):
                  part = text[i:i+3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{part}')
          PY
      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-report-api-${{ matrix.api }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
