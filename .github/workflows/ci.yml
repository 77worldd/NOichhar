name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Clean test and build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/src/main/**/*.xml', recursive=True)
          for path in files: ET.parse(path)
          print(f'Validated {len(files)} XML files')
          PY
      - name: Clean, test and build APKs
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 .github/workflows/report_failures.py build-output.log 'app/build/test-results/**/*.xml'
            exit "$status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NOichhar-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android emulator smoke tests
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run migration and navigation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Annotate instrumentation failures
        if: failure()
        run: python3 .github/workflows/report_failures.py /dev/null 'app/build/outputs/androidTest-results/**/*.xml'
      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
