name: Inspect Android test report
on:
  push:
    paths:
      - '.github/workflows/inspect-android.yml'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40521609741
          name: android-smoke-report-api-24
          path: reports
      - name: Annotate VPN test diagnostics
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Pre(HTMLParser):
              def __init__(self): super().__init__(); self.depth=0; self.chunks=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'pre': self.depth += 1
              def handle_endtag(self, tag):
                  if tag == 'pre' and self.depth:
                      self.depth -= 1
                      if not self.depth: self.chunks.append(''.join(self.current)); self.current=[]
              def handle_data(self, data):
                  if self.depth: self.current.append(data)
          files = list(Path('reports').rglob('*VpnSmokeTest*.html'))
          print('Reports:', [str(p) for p in files])
          for path in files:
              parser=Pre(); parser.feed(path.read_text(errors='replace'))
              for chunk in parser.chunks:
                  for i in range(0, len(chunk), 3500):
                      text=chunk[i:i+3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print(f'::error::{text}')
          PY
